# Archivo de configuración central para el proyecto de testing de API

# URL base de la API (puede ser reemplazada con -Dapi. Base= en terminal)
api.base=https://jsonplaceholder.typicode.com

# Puerto de conexión (en blanco porque no es necesario)
api.port=

# Timeout conexión en milisegundos
api.timeout.connection=5000

# Timeout respuesta en milisegundos
api.timeout.response=10000

# entorno
env=dev

# logs
api.logging=true

# Para autenticarse si es requerido
# api.username=usuario
# api.Password=contraseña

